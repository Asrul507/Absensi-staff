</head>
<body>

<!-- FORM LOGIN -->
<div id="form-login">
  <div class="login-field">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="email@perusahaan.com" autocomplete="email"
      onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <div class="login-field">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="Masukkan password"
      onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <button class="btn-login" onclick="login()">
    <i class="fa-solid fa-right-to-bracket"></i> Masuk
  </button>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:#64748b;">
    Belum punya akun?
    <button onclick="showSignup()" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:13px;font-weight:700;">Daftar di sini</button>
  </div>
</div>

<!-- FORM SIGNUP -->
<div id="form-signup" style="display:none;">
  <div style="text-align:center;margin-bottom:16px;">
    <span style="font-size:14px;font-weight:700;color:#e2e8f0;">Buat Akun Baru</span>
  </div>
  <div class="login-field">
    <label>Nama Lengkap</label>
    <input type="text" id="su-nama" placeholder="Nama lengkap"/>
  </div>
  <div class="login-field">
    <label>Email</label>
    <input type="email" id="su-email" placeholder="email@perusahaan.com"/>
  </div>
  <div class="login-field">
    <label>Password</label>
    <input type="password" id="su-pass" placeholder="Minimal 6 karakter"/>
  </div>
  <div class="login-field">
    <label>Konfirmasi Password</label>
    <input type="password" id="su-pass2" placeholder="Ulangi password"/>
  </div>
  <div class="login-field">
    <label>Role / Jabatan</label>
    <select id="su-role" style="width:100%;padding:13px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:14px;outline:none;">
      <option value="Staff" style="background:#1e293b;">Staff</option>
      <option value="Admin" style="background:#1e293b;">Admin</option>
    </select>
  </div>
  <button class="btn-login" onclick="signup()" style="background:linear-gradient(135deg,#059669,#047857);">
    <i class="fa-solid fa-user-plus"></i> Buat Akun
  </button>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:#64748b;">
    Sudah punya akun?
    <button onclick="showLogin()" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:13px;font-weight:700;">Login di sini</button>
  </div>
</div>

<!-- DEBUG INFO (tampil jika ada masalah login) -->

<!-- ===================== APP PAGE ===================== -->

<div id="appPage" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span class="topbar-title">GENIUS</span>
    </div>
    <div class="topbar-right">
      <span id="userName"></span>
      <span id="roleTag" style="font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:4px;"></span>
      <button class="btn-logout-top" onclick="logout()" title="Keluar"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div id="overlay" onclick="closeSidebar()"></div>
  <div id="sidebar"></div>
  <div id="content"></div>
  <nav id="bottomNav"></nav>
</div>

<!-- ===================== MODALS ===================== -->

<!-- Modal Absen -->

<div id="modal-absen" class="modal-bg">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-absen-title">Absen</h3>
      <button class="modal-close" onclick="closeModalAbsen()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="camera-container">
      <div class="camera-wrap">
        <video id="camera-video" autoplay playsinline style="width:100%;height:100%;object-fit:cover;"></video>
      </div>
    </div>
    <canvas id="camera-canvas" style="display:none;"></canvas>
    <div id="foto-preview-box" style="display:none;text-align:center;margin-bottom:12px;">
      <img id="foto-preview" style="width:220px;height:220px;border-radius:50%;object-fit:cover;border:4px solid rgba(59,130,246,.4);"/>
    </div>
    <div id="lokasi-info" class="gps-status idle"><i class="fa-solid fa-location-dot"></i> Menunggu lokasi...</div>
    <div id="absen-actions" style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn-absensi" onclick="ambilFoto()"><i class="fa-solid fa-camera"></i> Ambil Foto</button>
    </div>
    <div id="absen-confirm-actions" style="display:none;gap:8px;margin-top:12px;">
      <button class="btn-secondary" onclick="retakeFoto()" style="flex:1;justify-content:center;"><i class="fa-solid fa-rotate-left"></i> Ulangi</button>
      <button class="btn-absensi" onclick="submitAbsen()" style="flex:2;"><i class="fa-solid fa-check"></i> Konfirmasi Absen</button>
    </div>
  </div>
</div>

<!-- Modal Pengajuan -->

<div id="modal-pengajuan" class="modal-bg">
  <div class="modal-box">
    <div class="modal-header">
      <h3><i class="fa-solid fa-file-medical"></i> Ajukan Izin/Sakit/Cuti</h3>
      <button class="modal-close" onclick="closeModalPengajuan()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="field">
      <label>Tipe Pengajuan</label>
      <select id="pengajuan-tipe">
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
        <option value="Cuti">Cuti</option>
      </select>
    </div>
    <div class="field">
      <label>Keterangan</label>
      <textarea id="pengajuan-ket" placeholder="Jelaskan alasan..." rows="3"></textarea>
    </div>
    <div class="field">
      <label>Link Surat/Foto (opsional)</label>
      <input type="text" id="pengajuan-link" placeholder="https://drive.google.com/..."/>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModalPengajuan()" style="flex:1;">Batal</button>
      <button class="btn-primary" onclick="submitPengajuan()" style="flex:2;justify-content:center;"><i class="fa-solid fa-paper-plane"></i> Kirim</button>
    </div>
  </div>
</div>

<!-- Modal Edit User -->

<div id="modal-edit-user" class="modal-bg">
  <div class="modal-box">
    <div class="modal-header">
      <h3><i class="fa-solid fa-pen"></i> Edit Karyawan</h3>
      <button class="modal-close" onclick="closeModalEdit()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input type="hidden" id="edit-user-id"/>
    <div class="field"><label>Nama Lengkap</label><input type="text" id="edit-nama"/></div>
    <div class="field"><label>Email (tidak bisa diubah)</label><input type="text" id="edit-nip" disabled/></div>
    <div class="field">
      <label>Role</label>
      <select id="edit-jabatan"><option value="Staff">Staff</option><option value="Admin">Admin</option></select>
    </div>
    <div class="field">
      <label>Status Akun</label>
      <select id="edit-status-user"><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option></select>
    </div>
    <div class="field"><label>Password Baru <span style="color:#475569;font-weight:400;">(kosongkan jika tidak ganti)</span></label><input type="password" id="edit-password" placeholder="Password baru"/></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModalEdit()" style="flex:1;">Batal</button>
      <button class="btn-primary" onclick="saveEditUser()" style="flex:2;justify-content:center;"><i class="fa-solid fa-save"></i> Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Tambah User -->

<div id="modal-add-user" class="modal-bg">
  <div class="modal-box">
    <div class="modal-header">
      <h3><i class="fa-solid fa-user-plus"></i> Tambah Karyawan</h3>
      <button class="modal-close" onclick="closeModalAddUser()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="field"><label>Nama Lengkap</label><input type="text" id="add-nama" placeholder="Nama lengkap"/></div>
    <div class="field"><label>Email</label><input type="email" id="add-email" placeholder="email@perusahaan.com"/></div>
    <div class="field"><label>Password</label><input type="password" id="add-password" placeholder="Minimal 6 karakter"/></div>
    <div class="field">
      <label>Role</label>
      <select id="add-role"><option value="Staff">Staff</option><option value="Admin">Admin</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModalAddUser()" style="flex:1;">Batal</button>
      <button class="btn-primary" onclick="saveAddUser()" style="flex:2;justify-content:center;"><i class="fa-solid fa-save"></i> Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Shift -->

<div id="modal-shift" class="modal-bg">
  <div class="modal-box">
    <div class="modal-header">
      <h3><i class="fa-solid fa-clock"></i> <span id="modal-shift-title">Tambah Shift</span></h3>
      <button class="modal-close" onclick="closeModalShift()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input type="hidden" id="shift-id"/>
    <div class="field"><label>Nama Shift</label><input type="text" id="shift-nama" placeholder="Pagi / Sore / Malam"/></div>
    <div class="field"><label>Jam Masuk</label><input type="time" id="shift-masuk"/></div>
    <div class="field"><label>Jam Pulang</label><input type="time" id="shift-pulang"/></div>
    <div class="field"><label>Keterangan (opsional)</label><input type="text" id="shift-ket" placeholder="Keterangan tambahan"/></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModalShift()" style="flex:1;">Batal</button>
      <button class="btn-primary" onclick="saveShift()" style="flex:2;justify-content:center;"><i class="fa-solid fa-save"></i> Simpan</button>
    </div>
  </div>
</div>

<!-- Loading overlay -->

<div id="loading-overlay" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:14px;">
  <div class="loading-spinner"></div>
  <span class="loading-text">Memproses...</span>
</div>

<!-- Toast -->

<div id="toast-container"></div>

<script src="script.js"></script>

</body>
</html>
