<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genius Presence - Supabase</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loginPage">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-icon">🏢</div>
        <h1>GENIUS APP</h1>
        <p>Living Plaza Balikpapan</p>
      </div>
      <div class="login-field">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="username" placeholder="email@perusahaan.com" autocomplete="email" />
      </div>
      <div class="login-field">
        <label><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Masukkan password" />
      </div>
      <button class="btn-login" onclick="login()">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
    </div>
  </div>

  <div id="appPage" style="display:none;">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-menu" onclick="toggleSidebar()">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="topbar-title">GENIUS</span>
      </div>
      <div class="topbar-right">
        <span id="userName"></span>
        <button class="btn-logout-top" onclick="logout()" title="Keluar">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>

    <div id="overlay" onclick="closeSidebar()"></div>
    <div id="sidebar"></div>
    <div id="content"></div>
    <nav id="bottomNav"></nav>
  </div>

  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <span class="loading-text">Memproses...</span>
  </div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
